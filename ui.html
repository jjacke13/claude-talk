<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudia</title>
<style>
  :root { --bg: #04060b; --fg: #dbe7ff; --dim: #6f7d99; --line: rgba(120,150,255,.12); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .corner { position: fixed; padding: 18px 22px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); z-index: 2; user-select: none; }
  #title { top: 0; left: 0; color: var(--fg); font-weight: 600; letter-spacing: .32em; }
  #clock { top: 0; right: 0; font-variant-numeric: tabular-nums; }
  #state { bottom: 0; left: 0; transition: color .4s; }
  #ctx { bottom: 0; right: 0; font-variant-numeric: tabular-nums; }
  #state.listening { color: #7ef2c8; } #state.thinking { color: #b9a4ff; } #state.speaking { color: #ffc27a; }
  #state.offline { color: #ff7a7a; }
  #lines { position: fixed; left: 50%; top: 68%; transform: translateX(-50%); width: min(78vw, 900px);
    text-align: center; z-index: 2; pointer-events: none; }
  .line { opacity: 0; transition: opacity .8s ease, transform .8s ease; transform: translateY(6px); margin: 0 0 10px;
    text-wrap: balance; }
  .line.show { opacity: 1; transform: none; }
  .user { color: var(--dim); font-size: clamp(14px, 1.4vw, 18px); }
  .assistant { color: var(--fg); font-size: clamp(17px, 1.9vw, 25px); text-shadow: 0 0 24px rgba(160,190,255,.25); }
  #transcript { position: fixed; inset: 0; z-index: 3; display: none; padding: 64px clamp(16px, 8vw, 160px);
    overflow-y: auto; background: rgba(4,6,11,.86); backdrop-filter: blur(10px); }
  #transcript.show { display: block; }
  #transcript p { margin: 0 0 14px; max-width: 900px; }
  #transcript .u { color: var(--dim); } #transcript .a { color: var(--fg); }
  #transcript time { color: #4a5570; font-size: 12px; margin-right: 10px; font-variant-numeric: tabular-nums; }
  #transcript b { font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-right: 10px; color: #4a5570; }
  #transcript .a b { color: #8fa3d6; }
  #toggle { position: fixed; right: 22px; top: 44px; z-index: 4; background: none; border: 1px solid var(--line);
    color: var(--dim); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; letter-spacing: .1em;
    cursor: pointer; }
  #toggle:hover { color: var(--fg); border-color: rgba(120,150,255,.4); }
  @media (max-width: 700px) { #lines { top: 64%; width: 90vw; } .corner { padding: 12px 14px; font-size: 11px; } }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div id="title" class="corner">Claudia</div>
<div id="clock" class="corner">--:--</div>
<div id="state" class="corner">connecting</div>
<div id="ctx" class="corner"></div>
<button id="toggle" title="t">transcript</button>
<div id="lines"><p id="user" class="line user"></p><p id="assistant" class="line assistant"></p></div>
<div id="transcript"></div>
<script>
(() => {
  'use strict'
  // --- state ---------------------------------------------------------------------------------
  const HUES = { idle: 205, listening: 160, thinking: 262, speaking: 32, offline: 0 }
  let state = 'offline', hue = HUES.idle, events = []
  const $ = id => document.getElementById(id)
  const canvas = $('orb'), ctx = canvas.getContext('2d')

  // --- events (SSE, auto-reconnect; EventSource retries by itself) ------------------------------
  function connect() {
    const es = new EventSource('/events')
    es.onopen = () => setState(state === 'offline' ? 'idle' : state)
    es.onerror = () => setState('offline')
    es.onmessage = m => {
      let ev; try { ev = JSON.parse(m.data) } catch { return }
      if (ev.type === 'state') setState(ev.state)
      else if (ev.type === 'context') { $('ctx').textContent = `context ${ev.pct}%` }
      else if (ev.type === 'user' || ev.type === 'assistant') addLine(ev)
    }
  }
  function setState(s) {
    state = s
    const el = $('state'); el.textContent = s; el.className = 'corner ' + s
  }
  function addLine(ev) {
    // A reconnect replays the server's history: the same (type, ts) again is not a new line.
    if (events.some(e => e.ts === ev.ts && e.type === ev.type)) return
    events = events.concat([ev]).slice(-50)
    const el = $(ev.type)
    el.classList.remove('show')
    void el.offsetWidth                       // restart the fade
    el.textContent = ev.text
    el.classList.add('show')
    if (ev.type === 'assistant') { $('user').style.opacity = .45 }
    if (ev.type === 'user') { $('assistant').classList.remove('show') }
    if ($('transcript').classList.contains('show')) renderTranscript()
  }
  function renderTranscript() {
    const t = $('transcript')
    t.innerHTML = events.map(e => {
      const d = new Date(e.ts), hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0')
      const p = document.createElement('p'); p.className = e.type === 'user' ? 'u' : 'a'
      const time = document.createElement('time'); time.textContent = `${hh}:${mm}`
      const who = document.createElement('b'); who.textContent = e.type === 'user' ? 'you' : 'claudia'
      p.append(time, who, e.text)
      return p.outerHTML
    }).join('') || '<p class="u">nothing yet</p>'
    t.scrollTop = t.scrollHeight
  }
  function toggle() {
    const t = $('transcript'); t.classList.toggle('show')
    if (t.classList.contains('show')) renderTranscript()
  }
  $('toggle').onclick = toggle
  addEventListener('keydown', e => { if (e.key === 't' && !e.metaKey && !e.ctrlKey) toggle() })

  // --- clock -----------------------------------------------------------------------------------
  const tick = () => { const d = new Date(); $('clock').textContent = d.toTimeString().slice(0, 5) }
  tick(); setInterval(tick, 5000)

  // --- particle sphere -------------------------------------------------------------------------
  // N points on a unit sphere (fibonacci lattice), rotated on two axes and projected with a touch of
  // perspective; depth drives size and alpha. Per-state motion parameters are eased (~400 ms) so
  // state changes glide. Plain 2D canvas, additive squares, no sorting needed for additive blending.
  const N = 2600, GOLD = Math.PI * (3 - Math.sqrt(5))
  const PX = new Float32Array(N), PY = new Float32Array(N), PZ = new Float32Array(N)
  const PH = new Float32Array(N), FLY = new Uint8Array(N), BUCKET = new Uint8Array(N)
  const SX = new Float32Array(N), SY = new Float32Array(N), SS = new Float32Array(N)
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y), a = i * GOLD
    PX[i] = r * Math.cos(a); PY[i] = y; PZ[i] = r * Math.sin(a)
    PH[i] = Math.random() * Math.PI * 2
    FLY[i] = Math.random() < 0.07 ? 1 : 0          // the few that drift off while listening
  }
  // motion parameters per state: rotation speeds (rad/s), radius scale, jitter, swirl, band amplitude
  const MOTION = {
    idle:      { ry: 0.18, rx: 0.05, rad: 1.00, jit: 0.00, swirl: 0.0, band: 0.00, glow: 0.25 },
    listening: { ry: 0.10, rx: 0.03, rad: 1.06, jit: 0.16, swirl: 0.0, band: 0.00, glow: 0.55 },
    thinking:  { ry: 0.85, rx: 0.22, rad: 0.92, jit: 0.02, swirl: 1.6, band: 0.00, glow: 0.80 },
    speaking:  { ry: 0.25, rx: 0.06, rad: 1.02, jit: 0.00, swirl: 0.0, band: 0.10, glow: 1.00 },
    offline:   { ry: 0.04, rx: 0.00, rad: 0.90, jit: 0.00, swirl: 0.0, band: 0.00, glow: 0.05 },
  }
  const cur = { ...MOTION.idle }
  let ax = 0.4, ay = 0, swirlPhase = 0, dpr = 1, last = 0
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1)
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr
  }
  addEventListener('resize', resize); resize()
  // Hidden tab: the browser stops requestAnimationFrame itself (no work done); on return, `last` is
  // reset so the first frame does not integrate the whole absence. (An explicit document.hidden
  // guard is wrong: occluded windows report "hidden" while rAF still runs.)
  document.addEventListener('visibilitychange', () => { last = 0 })

  function draw(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016
    last = now
    const t = now / 1000
    const target = MOTION[state] ?? MOTION.idle
    const k = 1 - Math.exp(-dt / 0.13)              // ~95 % of the way in 400 ms
    for (const key in cur) cur[key] += (target[key] - cur[key]) * k
    hue += (( HUES[state] ?? HUES.idle) - hue) * k
    ax += cur.rx * dt; ay += cur.ry * dt
    swirlPhase += cur.swirl * dt                    // accumulated, so easing swirl to 0 stops the flow instead of snapping it

    const w = canvas.width, h = canvas.height, cx = w / 2, cy = h * 0.42
    const breathe = state === 'idle' ? 1 + 0.03 * Math.sin(t * 0.8) : 1 + 0.012 * Math.sin(t * 1.6)
    const R = Math.min(w, h) * 0.2 * cur.rad * breathe
    const env = Math.abs(Math.sin(t * 6.3)) * (0.6 + 0.4 * Math.sin(t * 1.7 + 1))   // speaking amplitude
    const cay = Math.cos(ay), say = Math.sin(ay), cax = Math.cos(ax), sax = Math.sin(ax)

    ctx.clearRect(0, 0, w, h)
    ctx.globalCompositeOperation = 'lighter'
    const halo = ctx.createRadialGradient(cx, cy, R * 0.1, cx, cy, R * (2.2 + cur.glow))
    halo.addColorStop(0, `hsla(${hue}, 90%, 60%, ${0.10 + 0.16 * cur.glow})`)
    halo.addColorStop(0.55, `hsla(${hue + 20}, 90%, 55%, ${0.03 + 0.05 * cur.glow})`)
    halo.addColorStop(1, 'hsla(0,0%,0%,0)')
    ctx.fillStyle = halo; ctx.fillRect(0, 0, w, h)

    // project every point; bucket by depth so fillStyle is set 8 times, not N times
    for (let i = 0; i < N; i++) {
      let x = PX[i], y = PY[i], z = PZ[i]
      // thinking: differential rotation — latitudes slide past each other, points stream along parallels
      if (swirlPhase > 0) {
        const s = swirlPhase * (0.35 + 0.65 * y * y) * (y < 0 ? -1 : 1), cs = Math.cos(s), sn = Math.sin(s)
        const x2 = x * cs - z * sn; z = x * sn + z * cs; x = x2
      }
      // radius: listening jitter (+ flyers), speaking latitude bands
      let rr = 1
      if (cur.jit > 0.001) {
        rr += cur.jit * (0.5 * Math.sin(t * 1.7 + PH[i]) + 0.5 * Math.sin(t * 2.9 + PH[i] * 2.1))
        if (FLY[i]) rr += cur.jit * 2.2 * (0.5 + 0.5 * Math.sin(t * 0.9 + PH[i]))
      }
      if (cur.band > 0.001) rr += cur.band * env * Math.sin(y * 7 - t * 5)
      // rotate around Y then X
      const x1 = x * cay + z * say, z1 = -x * say + z * cay
      const y2 = y * cax - z1 * sax, z2 = y * sax + z1 * cax
      const persp = 1 + z2 * 0.28, d = (z2 + 1) * 0.5      // z2 towards the viewer → bigger, brighter
      SX[i] = cx + x1 * rr * R * persp
      SY[i] = cy + y2 * rr * R * persp
      SS[i] = (0.7 + 1.9 * d) * dpr
      BUCKET[i] = Math.min(7, (d * 8) | 0)
    }
    for (let b = 0; b < 8; b++) {
      const d = (b + 0.5) / 8
      ctx.fillStyle = `hsla(${hue + 10 * d}, 90%, ${52 + 34 * d}%, ${0.14 + 0.72 * d})`
      for (let i = 0; i < N; i++) if (BUCKET[i] === b) { const s = SS[i]; ctx.fillRect(SX[i] - s / 2, SY[i] - s / 2, s, s) }
    }
    // soft glow on the nearest points only
    ctx.fillStyle = `hsla(${hue + 20}, 100%, 85%, ${0.05 + 0.08 * cur.glow})`
    for (let i = 0; i < N; i++) if (BUCKET[i] >= 6) { const s = SS[i] * 3; ctx.fillRect(SX[i] - s / 2, SY[i] - s / 2, s, s) }
    ctx.globalCompositeOperation = 'source-over'
    requestAnimationFrame(draw)
  }
  requestAnimationFrame(draw)
  connect()
})()
</script>
</body>
</html>
