<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudia</title>
<style>
  :root { --bg: #04060b; --fg: #dbe7ff; --dim: #6f7d99; --line: rgba(120,150,255,.12); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .corner { position: fixed; padding: 18px 22px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); z-index: 2; user-select: none; }
  #title { top: 0; left: 0; color: var(--fg); font-weight: 600; letter-spacing: .32em; }
  #clock { top: 0; right: 0; font-variant-numeric: tabular-nums; }
  #state { bottom: 0; left: 0; transition: color .4s; }
  #ctx { bottom: 0; right: 0; font-variant-numeric: tabular-nums; }
  #state.listening { color: #7ef2c8; } #state.thinking { color: #b9a4ff; } #state.speaking { color: #ffc27a; }
  #state.offline { color: #ff7a7a; }
  #lines { position: fixed; left: 50%; top: 68%; transform: translateX(-50%); width: min(78vw, 900px);
    text-align: center; z-index: 2; pointer-events: none; }
  .line { opacity: 0; transition: opacity .8s ease, transform .8s ease; transform: translateY(6px); margin: 0 0 10px;
    text-wrap: balance; }
  .line.show { opacity: 1; transform: none; }
  .user { color: var(--dim); font-size: clamp(14px, 1.4vw, 18px); }
  .assistant { color: var(--fg); font-size: clamp(17px, 1.9vw, 25px); text-shadow: 0 0 24px rgba(160,190,255,.25); }
  #transcript { position: fixed; inset: 0; z-index: 3; display: none; padding: 64px clamp(16px, 8vw, 160px);
    overflow-y: auto; background: rgba(4,6,11,.86); backdrop-filter: blur(10px); }
  #transcript.show { display: block; }
  #transcript p { margin: 0 0 14px; max-width: 900px; }
  #transcript .u { color: var(--dim); } #transcript .a { color: var(--fg); }
  #transcript time { color: #4a5570; font-size: 12px; margin-right: 10px; font-variant-numeric: tabular-nums; }
  #transcript b { font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-right: 10px; color: #4a5570; }
  #transcript .a b { color: #8fa3d6; }
  #toggle { position: fixed; right: 22px; top: 44px; z-index: 4; background: none; border: 1px solid var(--line);
    color: var(--dim); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; letter-spacing: .1em;
    cursor: pointer; }
  #toggle:hover { color: var(--fg); border-color: rgba(120,150,255,.4); }
  @media (max-width: 700px) { #lines { top: 64%; width: 90vw; } .corner { padding: 12px 14px; font-size: 11px; } }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div id="title" class="corner">Claudia</div>
<div id="clock" class="corner">--:--</div>
<div id="state" class="corner">connecting</div>
<div id="ctx" class="corner"></div>
<button id="toggle" title="t">transcript</button>
<div id="lines"><p id="user" class="line user"></p><p id="assistant" class="line assistant"></p></div>
<div id="transcript"></div>
<script>
(() => {
  'use strict'
  // --- state ---------------------------------------------------------------------------------
  const HUES = { idle: 205, listening: 160, thinking: 262, speaking: 32, offline: 0 }
  let state = 'offline', hue = HUES.idle, energy = 0.2, events = []
  const $ = id => document.getElementById(id)
  const canvas = $('orb'), ctx = canvas.getContext('2d')

  // --- events (SSE, auto-reconnect; EventSource retries by itself) ------------------------------
  function connect() {
    const es = new EventSource('/events')
    es.onopen = () => setState(state === 'offline' ? 'idle' : state)
    es.onerror = () => setState('offline')
    es.onmessage = m => {
      let ev; try { ev = JSON.parse(m.data) } catch { return }
      if (ev.type === 'state') setState(ev.state)
      else if (ev.type === 'context') { $('ctx').textContent = `context ${ev.pct}%` }
      else if (ev.type === 'user' || ev.type === 'assistant') addLine(ev)
    }
  }
  function setState(s) {
    state = s
    const el = $('state'); el.textContent = s; el.className = 'corner ' + s
  }
  function addLine(ev) {
    events = events.concat([ev]).slice(-50)
    const el = $(ev.type)
    el.classList.remove('show')
    void el.offsetWidth                       // restart the fade
    el.textContent = ev.text
    el.classList.add('show')
    if (ev.type === 'assistant') { $('user').style.opacity = .45 }
    if (ev.type === 'user') { $('assistant').classList.remove('show') }
    if ($('transcript').classList.contains('show')) renderTranscript()
  }
  function renderTranscript() {
    const t = $('transcript')
    t.innerHTML = events.map(e => {
      const d = new Date(e.ts), hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0')
      const p = document.createElement('p'); p.className = e.type === 'user' ? 'u' : 'a'
      const time = document.createElement('time'); time.textContent = `${hh}:${mm}`
      const who = document.createElement('b'); who.textContent = e.type === 'user' ? 'you' : 'claudia'
      p.append(time, who, e.text)
      return p.outerHTML
    }).join('') || '<p class="u">nothing yet</p>'
    t.scrollTop = t.scrollHeight
  }
  function toggle() {
    const t = $('transcript'); t.classList.toggle('show')
    if (t.classList.contains('show')) renderTranscript()
  }
  $('toggle').onclick = toggle
  addEventListener('keydown', e => { if (e.key === 't' && !e.metaKey && !e.ctrlKey) toggle() })

  // --- clock -----------------------------------------------------------------------------------
  const tick = () => { const d = new Date(); $('clock').textContent = d.toTimeString().slice(0, 5) }
  tick(); setInterval(tick, 5000)

  // --- orb -------------------------------------------------------------------------------------
  const rings = []          // listening ripples: {r0, born}
  let lastRing = 0, dpr = 1
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1)
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr
  }
  addEventListener('resize', resize); resize()

  function draw(now) {
    const t = now / 1000
    const w = canvas.width, h = canvas.height, cx = w / 2, cy = h * 0.42
    const base = Math.min(w, h) * 0.17
    // per-state motion; `energy` eases so transitions glide instead of snapping
    let target = 0.2, breathe
    if (state === 'idle') { target = 0.25; breathe = 1 + 0.035 * Math.sin(t * 0.9) }
    else if (state === 'listening') { target = 0.55; breathe = 1 + 0.03 * Math.sin(t * 2.2) }
    else if (state === 'thinking') { target = 0.8; breathe = 1 + 0.05 * Math.sin(t * 4.5) }
    else if (state === 'speaking') { target = 1; breathe = 1 + 0.16 * Math.abs(Math.sin(t * 6.3)) * (0.6 + 0.4 * Math.sin(t * 1.7 + 1)) }
    else { target = 0.05; breathe = 1 }
    energy += (target - energy) * 0.04
    const th = HUES[state] ?? HUES.idle
    hue += (th - hue) * 0.05
    const r = base * breathe

    ctx.clearRect(0, 0, w, h)
    ctx.globalCompositeOperation = 'lighter'

    // halo
    const halo = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * (2.6 + energy))
    halo.addColorStop(0, `hsla(${hue}, 90%, 62%, ${0.18 + 0.22 * energy})`)
    halo.addColorStop(0.5, `hsla(${hue + 20}, 90%, 55%, ${0.05 + 0.08 * energy})`)
    halo.addColorStop(1, 'hsla(0,0%,0%,0)')
    ctx.fillStyle = halo; ctx.fillRect(0, 0, w, h)

    // core
    const core = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, r * 0.05, cx, cy, r)
    core.addColorStop(0, `hsla(${hue + 30}, 100%, 92%, .95)`)
    core.addColorStop(0.35, `hsla(${hue}, 95%, 66%, .85)`)
    core.addColorStop(1, `hsla(${hue - 15}, 90%, 40%, .15)`)
    ctx.fillStyle = core
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill()

    // thinking: rotating shimmer arcs
    if (state === 'thinking') {
      for (let i = 0; i < 3; i++) {
        const a = t * (1.6 + i * 0.5) + i * 2.1
        ctx.strokeStyle = `hsla(${hue + 40}, 100%, 80%, ${0.35 - i * 0.08})`
        ctx.lineWidth = 2 * dpr
        ctx.beginPath(); ctx.arc(cx, cy, r * (1.15 + i * 0.12), a, a + 1.4); ctx.stroke()
      }
    }
    // listening: ripples expanding outward
    if (state === 'listening' && now - lastRing > 650) { rings.push({ born: now }); lastRing = now }
    for (let i = rings.length - 1; i >= 0; i--) {
      const age = (now - rings[i].born) / 1800
      if (age > 1) { rings.splice(i, 1); continue }
      ctx.strokeStyle = `hsla(${hue}, 90%, 70%, ${(1 - age) * 0.5})`
      ctx.lineWidth = (2.5 - 2 * age) * dpr
      ctx.beginPath(); ctx.arc(cx, cy, r * (1.05 + age * 1.9), 0, Math.PI * 2); ctx.stroke()
    }
    // speaking: a second, softer pulse ring
    if (state === 'speaking') {
      const p = Math.abs(Math.sin(t * 6.3 + 0.6))
      ctx.strokeStyle = `hsla(${hue + 10}, 95%, 75%, ${0.15 + 0.3 * p})`
      ctx.lineWidth = 3 * dpr
      ctx.beginPath(); ctx.arc(cx, cy, r * (1.08 + 0.25 * p), 0, Math.PI * 2); ctx.stroke()
    }
    ctx.globalCompositeOperation = 'source-over'
    requestAnimationFrame(draw)
  }
  requestAnimationFrame(draw)
  connect()
})()
</script>
</body>
</html>
